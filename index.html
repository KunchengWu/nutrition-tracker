function indexDay(s){let d=new Date(s+'T12:00:00');return(d.getDay()+6)%7}function defaultFoods(){return PLAN[indexDay(date)][meal].map(a=>[...a])}function getFoods(){return db[date]?.[meal]||defaultFoods()}function saveFoods(a){db[date]??={};db[date][meal]=a;localStorage.setItem(K,JSON.stringify(db));render()}
